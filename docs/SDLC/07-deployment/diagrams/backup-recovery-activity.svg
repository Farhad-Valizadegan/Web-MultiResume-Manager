" font-family="Arial">Back up database, private uploads and public profile assets</text><rect x="16" y="294.395" width="447.226" height="36.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="26" y="317.526" fill="#000" font-size="14" textLength="427.226" font-family="Arial">Securely preserve required environment/key configuration separately</text><rect x="85.655" y="350.493" width="307.916" height="36.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="95.655" y="373.625" fill="#000" font-size="14" textLength="287.916" font-family="Arial">Record release, schema and file-set identifiers</text><rect x="116.379" y="406.592" width="246.468" height="36.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="126.379" y="429.724" fill="#000" font-size="14" textLength="226.468" font-family="Arial">Protect backup access and retention</text><rect x="73.976" y="462.69" width="331.274" height="36.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="83.976" y="485.822" fill="#000" font-size="14" textLength="311.274" font-family="Arial">Verify backup readability and restore prerequisites</text><rect x="679.928" y="182.197" width="360.095" height="36.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="689.928" y="205.329" fill="#000" font-size="14" textLength="340.095" font-family="Arial">Select matching code, database and file recovery point</text><rect x="683.832" y="238.296" width="352.288" height="36.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="693.832" y="261.428" fill="#000" font-size="14" textLength="332.288" font-family="Arial">Preserve incident evidence and stop conflicting writes</text><rect x="702.104" y="294.395" width="315.743" height="36.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="712.104" y="317.526" fill="#000" font-size="14" t