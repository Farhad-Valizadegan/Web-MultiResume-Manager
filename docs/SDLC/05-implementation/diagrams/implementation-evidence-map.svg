d cases and checked commits</text><text x="660" y="226.428" fill="#000" font-size="14" textLength="266.137" font-family="Arial">Not proof of every behavior or environment</text></g><!--entity Conditional--><g class="entity" data-qualified-name="Conditional" id="ent0003" data-source-line="12"><rect x="6" y="49.099" width="336.771" height="68.296" fill="#FEF3C7" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="72.23" fill="#000" font-size="14" textLength="238.137" font-family="Arial">Source present, availability conditional</text><text x="16" y="88.329" fill="#000" font-size="14" textLength="252.15" font-family="Arial">Registration code: public routes disabled</text><text x="16" y="104.428" fill="#000" font-size="14" textLength="316.771" font-family="Arial">Mail/queue configuration: operation not established</text></g><!--entity Pending--><g class="entity" data-qualified-name="Pending" id="ent0004" data-source-line="13"><rect x="29.5" y="135.099" width="290.067" height="100.493" fill="#FEE2E2" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="39.5" y="158.23" fill="#000" font-size="14" textLength="270.067" font-family="Arial">Evidence not established by documentation</text><text x="39.5" y="174.329" fill="#000" font-size="14" textLength="259.902" font-family="Arial">Production restore drill or load benchmark</text><text x="39.5" y="190.428" fill="#000" font-size="14" textLength="172.744" font-family="Arial">Complete accessibility audit</text><text x="39.5" y="206.526" fill="#000" font-size="14" textLength="267.695" font-family="Arial">Malware scanning or monitoring integration</text><text x="39.5" y="222.625" fill="#000" font-size="14" textLength="195.296" font-family="Arial">Privacy compliance certification</text></g><!--entity Guide--><g class="entity" data-qualified-name="Guide" id="ent0005" data-source-line="14"><rect x="691.5" y="333.099" width="237.116" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" 